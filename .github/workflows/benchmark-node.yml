name: Benchmarks Node

permissions: {}

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - '**/*.rs'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'packages/rolldown/**'
      - 'packages/bench/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/benchmark-node.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  benchmark-node:
    name: Benchmark Node
    if: >
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft != true &&
      !contains(github.event.pull_request.labels.*.name, 'graphite: merge-when-ready'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Download previous benchmark data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # https://github.com/rolldown/benchmark-results-storage
          repository: rolldown/benchmark-results-storage
          path: tmp
          persist-credentials: false

      - name: List Files
        run: find -maxdepth 2 -ls

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          version: '0.2.1'
          cache: true

      - name: Setup Rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          tools: just
          cache-key: release-build
          save-cache: ${{ github.ref_name == 'main' }}

      - name: Setup Benchmark Input
        run: just setup-bench

      - name: Build packages
        # The tracking variant also records per-suite peak Rust-side memory
        # (`(peak memory)` series). It shifts timing numbers by at most ~2.3%
        # once — far below the 110% alert threshold.
        run: just build-rolldown-release-tracking

      - name: Run benchmarks
        run: vp run --filter bench bench-ci

      # The action compares the new run against the previous entry only, so it
      # needs a short window of history rather than the whole series. Rebuilding
      # it from the JSON lines is what lets the 17 MB nested JSON stay frozen.
      - name: Build the comparison window
        run: node scripts/misc/benchmark-storage/window-from-jsonl.mjs --jsonl tmp/benchmark-node-output.jsonl --out tmp/window.json

      - name: Show/Update benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: 'Node Benchmark'
          # What benchmark tool the output.txt came from
          tool: 'customSmallerIsBetter'
          # Where the output from the benchmark tool is stored
          output-file-path: tmp/new-benchmark-node-output.json
          # Where the previous data file is stored
          external-data-json-path: tmp/window.json
          fail-on-alert: false
          summary-always: true
          comment-always: false
          save-data-file: ${{ github.event_name == 'push' }}
          alert-threshold: '110%' # Too much noise in the benchmark results
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save benchmark result
        if: github.event_name == 'push'
        env:
          # Results are stored in https://github.com/rolldown/benchmark-results-storage
          API_TOKEN_GITHUB: ${{ secrets.REPO_TOKEN_BENCHMARK_RESULTS }}
        # Appends this run as Entry-schema JSON lines (see the storage repo's
        # README). Pushes with a rebase retry, so concurrent runs append instead
        # of overwriting each other.
        run: node scripts/misc/benchmark-storage/push-results.mjs
