name: Benchmarks Rust

permissions: {}

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - '**/*.rs'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/misc/setup-benchmark-input/**'
      - '.github/workflows/benchmark-rust.yml'
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - '**/*.rs'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/misc/setup-benchmark-input/**'
      - '.github/workflows/benchmark-rust.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  codspeed-benchmark:
    name: Codspeed Benchmark
    if: >
      github.repository == 'rolldown/rolldown' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - parallel:
          - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
            with:
              version: '1.7.0'
              cache: true

          - name: Setup Rust
            uses: oxc-project/setup-rust@12a52e3caf7bac9d8b9ca550a82c425ed6343aee # v1.0.18
            with:
              tools: just, cargo-codspeed
              cache-key: codspeed
              save-cache: ${{ github.ref_name == 'main' }}

      - name: Setup Benchmark Input
        id: benchmark-input
        background: true
        run: just setup-bench

      - name: Build benchmark
        env:
          RUSTFLAGS: '-C debuginfo=1 -C strip=none -g -C lto=false -C codegen-units=16 --cfg codspeed'
        run: |
          bench=$(cargo build --release -p bench --bench bench --features codspeed --message-format=json | jq -r 'select(.reason == "compiler-artifact" and .target.name == "bench" and .executable != null) | .executable')
          mkdir -p target/codspeed/analysis/bench
          mv "$bench" target/codspeed/analysis/bench/

      - wait: benchmark-input

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          run: cargo codspeed run -p bench
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: simulation
