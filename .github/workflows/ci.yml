name: CI
# Jobs in this workflow are all required run successfully before the PR can be merged. This is enforced by using GitHub status checks.
# What's GitHub status check: https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/about-status-checks

permissions: {}

on:
  pull_request:
    types: [opened, synchronize]
  merge_group:
  push:
    branches:
      - main
      - 'renovate/**' # For renovate bot "automerge": true
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  # JOB to run change detection
  changes: # https://github.com/dorny/paths-filter
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      # A Windows CI request runs the complete Windows suite, even for paths outside the normal filters.
      rust-changes: "${{ (steps.filter.outputs.rust-changes == 'true') || (github.ref_name == 'main') || (steps.pr-labels.outputs.run-windows == 'true') }}"
      node-changes: "${{ (steps.filter.outputs.node-changes == 'true') || (github.ref_name == 'main') || (steps.pr-labels.outputs.run-windows == 'true') }}"
      # Allows opting into Windows CI per-PR by adding the `ci: windows` label.
      run-windows: "${{ steps.pr-labels.outputs.run-windows == 'true' }}"
      # Allows opting into the WebContainer smoke test per-PR by adding the `ci: webcontainer` label.
      run-webcontainer: "${{ steps.pr-labels.outputs.run-webcontainer == 'true' }}"
    steps:
      # Reruns keep the original event payload, so query the current labels instead.
      - name: Read pull request labels
        if: github.event_name == 'pull_request'
        id: pr-labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! labels="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.labels[].name]')"; then
            echo "::warning::Could not read pull request labels; running Windows CI and skipping the WebContainer smoke test."
            run_windows=true
            # fail closed: the WebContainer suite runs third-party code fetched at test time, so never opt in without a maintainer label
            run_webcontainer=false
          else
            run_windows="$(jq 'any(. == "ci: windows")' <<< "$labels")"
            run_webcontainer="$(jq 'any(. == "ci: webcontainer")' <<< "$labels")"
          fi
          echo "run-windows=${run_windows}" >> "$GITHUB_OUTPUT"
          echo "run-webcontainer=${run_webcontainer}" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            infra-changes: &infra-changes
              - '.github/workflows/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            rust-changes: &rust-changes
              - *infra-changes
              - 'crates/**'
              - 'tasks/**'
              - 'scripts/src/esbuild-tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.gitattributes'
              - 'justfile'
              - 'test262'
            node-changes:
              - *rust-changes
              - 'packages/**'
              - 'examples/**'
              - 'scripts/**'
              - 'rollup'
      - name: Show outputs
        run: |
          echo "Rust changes: ${{ (steps.filter.outputs.rust-changes == 'true') || (github.ref_name == 'main') || (steps.pr-labels.outputs.run-windows == 'true') }}"
          echo "Node changes: ${{ (steps.filter.outputs.node-changes == 'true') || (github.ref_name == 'main') || (steps.pr-labels.outputs.run-windows == 'true') }}"

  rust-validation:
    name: Rust Validation
    needs: changes
    if: ${{ needs.changes.outputs.rust-changes == 'true' }}
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Setup Rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          tools: just
          cache-key: lint
          save-cache: ${{ github.ref_name == 'main' }}
          components: clippy rustfmt

      - run: just lint-rust

      # `just lint-rust` uses `--all-features`, which turns the opt-in `tokio-runtime`
      # feature ON and so never lints the shipped `not(tokio-runtime)` arms.
      - name: Clippy (async-runtime feature)
        run: cargo clippy -p rolldown_utils -p rolldown_binding --no-default-features --features async-runtime --all-targets -- --deny warnings

      - name: Check allocations
        run: |
          cargo allocs
          git diff --exit-code -- tasks/track_memory_allocations/allocs.snap ||
          (echo 'Allocations have changed. Run `just allocs` to update the snapshot, otherwise please fix the regression.' && exit 1)

  cargo-test:
    needs: changes
    strategy:
      matrix:
        target: >-
          ${{ (github.ref_name == 'main') && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]')
              || (needs.changes.outputs.run-windows == 'true') && fromJSON('["ubuntu-latest","windows-latest"]')
              || fromJSON('["ubuntu-latest"]') }}
    uses: ./.github/workflows/reusable-cargo-test.yml
    with:
      os: ${{ matrix.target }}
      changed: ${{ needs.changes.outputs.rust-changes == 'true' }}

  node-test-windows:
    needs: [changes, build-rolldown-windows]
    uses: ./.github/workflows/reusable-node-test.yml
    if: |
      (github.ref_name == 'main' || needs.changes.outputs.run-windows == 'true') &&
      always() &&
      (needs.build-rolldown-windows.result == 'success' || needs.build-rolldown-windows.result == 'skipped')
    with:
      os: windows-latest
      node-version: 24
      changed: ${{ needs.changes.outputs.node-changes == 'true' }}

  node-test-macos:
    needs: [changes, build-rolldown-macos]
    uses: ./.github/workflows/reusable-node-test.yml
    if: |
      github.ref_name == 'main' &&
      always() &&
      (needs.build-rolldown-macos.result == 'success' || needs.build-rolldown-macos.result == 'skipped')
    with:
      os: macos-latest
      node-version: 24
      changed: ${{ needs.changes.outputs.node-changes == 'true' }}

  node-test-ubuntu:
    needs: [changes, build-rolldown-ubuntu]
    # Matrix is defined here (not inside reusable-node-test.yml) because when the
    # reusable workflow's job is skipped via `if: inputs.changed`, an internal matrix
    # would never expand — producing zero jobs instead of skipped ones. GitHub required
    # status checks need the job names to exist (even as "skipped") to pass.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    uses: ./.github/workflows/reusable-node-test.yml
    if: |
      always() &&
      (needs.build-rolldown-ubuntu.result == 'success' || needs.build-rolldown-ubuntu.result == 'skipped')
    with:
      os: ubuntu-latest
      node-version: ${{ matrix.node-version }}
      changed: ${{ needs.changes.outputs.node-changes == 'true' }}

  wasi:
    needs: changes
    uses: ./.github/workflows/reusable-wasi.yml
    with:
      changed: ${{ needs.changes.outputs.node-changes == 'true' }}

  # Runs the packed @rolldown/browser in a real browser page on every PR that touches node code. The
  # `ci: webcontainer` label adds the WebContainer suite to the same job; it never runs on path
  # changes or on main.
  browser:
    needs: changes
    uses: ./.github/workflows/reusable-browser.yml
    with:
      changed: ${{ needs.changes.outputs.node-changes == 'true' }}
      webcontainer: ${{ needs.changes.outputs.run-webcontainer == 'true' }}

  native-async-runtime:
    name: Native Async Runtime
    needs: changes
    if: ${{ needs.changes.outputs.node-changes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          tools: just
          cache-key: debug-build-async-runtime
          save-cache: ${{ github.ref_name == 'main' }}

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          version: '0.2.1'
          cache: true

      - name: Build Rolldown with the shared async runtime
        run: just build-rolldown-async-runtime

      # tests/dev/*.test.ts import this workspace package at module scope, so collection
      # fails without its dist/. They are also collected on the single-thread leg below,
      # where `dev()` is unsupported — hence `test.skipIf(isSingleThread)` on each of them.
      - name: Build `@rolldown/test-dev-server`
        run: vp run --filter '@rolldown/test-dev-server' build

      # The single-thread lane sets `ROLLDOWN_PARK_DEADLINE_MS` (inside the recipe)
      # because a `block_on`-over-JS hang freezes the JS event loop before vitest's own
      # timeout can fire, so the runtime must panic with `BlockOnDeadlock` instead.
      - name: Scheduler unit tests + node & watcher suites (single- and multi-thread flavors)
        run: just test-async-runtime

      - name: Prove the production graphs are tokio-free
        run: just check-no-tokio

  native-async-runtime-check:
    name: Native Async Runtime Lifecycle (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.node-changes == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Setup Rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          tools: just
          cache-key: native-async-runtime-check-${{ matrix.os }}
          save-cache: ${{ github.ref_name == 'main' }}

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          version: '0.2.1'
          cache: true

      - name: Test package transaction recovery
        run: just test-package-transactions

      # Builds the real `.node` addon with the test-only waker probe the step below needs.
      - name: Build shared async runtime probe
        run: just build-rolldown-async-runtime

      - name: Test worker environment teardown
        run: vp run --filter rolldown-tests test:main async-runtime-worker-teardown.test.ts
        env:
          ROLLDOWN_TEST_REQUIRE_SHARED_ASYNC_RUNTIME: '1'

      # tests/dev/*.test.ts import this workspace package at module scope, so
      # collection fails without its dist/ (same note as the ubuntu
      # native-async-runtime job).
      - name: Build `@rolldown/test-dev-server`
        run: vp run --filter '@rolldown/test-dev-server' build

      # Per-PR OS coverage for the suites the ubuntu-only PR lanes cannot
      # exercise per OS: the runtime's timer/debounce paths, poll-thread
      # scheduling, and watcher/dev-engine lifecycle on a real mac/windows
      # binding. The suites force `usePolling: true` (CI stability) except the
      # one native smoke in watch.test.ts, which asserts real
      # FSEvents/ReadDirectoryChangesW event delivery per OS.
      # `&&` chaining (not a multi-line block) matches reusable-node-test.yml so
      # a first-command failure fails the step under pwsh too. `dev/` scopes the
      # second run to tests/dev/* (dev-watch.test.ts is excluded by test:main
      # and covered by test:watcher).
      - name: Watch & dev-engine suites
        run: vp run --filter rolldown-tests test:watcher && vp run --filter rolldown-tests test:main dev/

  node-dev-server-test-windows:
    needs: [changes, build-rolldown-windows]
    uses: ./.github/workflows/reusable-node-dev-server-test.yml
    if: |
      (github.ref_name == 'main' || needs.changes.outputs.run-windows == 'true') &&
      always() &&
      (needs.build-rolldown-windows.result == 'success' || needs.build-rolldown-windows.result == 'skipped')
    with:
      os: windows-latest
      node-version: 24
      changed: ${{ needs.changes.outputs.node-changes == 'true' }}

  node-dev-server-test-macos:
    needs: [changes, build-rolldown-macos]
    uses: ./.github/workflows/reusable-node-dev-server-test.yml
    if: |
      github.ref_name == 'main' &&
      always() &&
      (needs.build-rolldown-macos.result == 'success' || needs.build-rolldown-macos.result == 'skipped')
    with:
      os: macos-latest
      node-version: 24
      changed: ${{ needs.changes.outputs.node-changes == 'true' }}

  node-dev-server-test-ubuntu:
    needs: [changes, build-rolldown-ubuntu]
    # Matrix is defined here (not inside reusable-node-dev-server-test.yml) because when the
    # reusable workflow's job is skipped via `if: inputs.changed`, an internal matrix
    # would never expand — producing zero jobs instead of skipped ones. GitHub required
    # status checks need the job names to exist (even as "skipped") to pass.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    uses: ./.github/workflows/reusable-node-dev-server-test.yml
    if: |
      always() &&
      (needs.build-rolldown-ubuntu.result == 'success' || needs.build-rolldown-ubuntu.result == 'skipped')
    with:
      os: ubuntu-latest
      node-version: ${{ matrix.node-version }}
      changed: ${{ needs.changes.outputs.node-changes == 'true' }}

  vite-test-ubuntu:
    name: Vite Test Ubuntu
    needs: [changes, build-rolldown-ubuntu]
    if: |
      always() &&
      (needs.build-rolldown-ubuntu.result == 'success' || needs.build-rolldown-ubuntu.result == 'skipped')
    runs-on: namespace-profile-linux-x64-default
    timeout-minutes: 30
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          version: '0.2.1'
          cache: true

      - name: Download Native Rolldown Build
        if: ${{ needs.changes.outputs.node-changes == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rolldown-native-ubuntu-latest
          path: packages/rolldown/dist

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      # `just setup-vite` is the only entry point that touches `vite/`;
      # run.ts only clones the prepared checkout.
      - name: Setup Vite checkout
        if: ${{ needs.changes.outputs.node-changes == 'true' }}
        run: vp run --filter '@rolldown-internal/scripts' setup-vite

      - name: Run Vite Tests
        if: ${{ needs.changes.outputs.node-changes == 'true' }}
        run: vp run --filter vite-tests test

  vite-test-windows:
    name: Vite Test Windows
    needs: [changes, build-rolldown-windows]
    if: |
      (github.ref_name == 'main' || needs.changes.outputs.run-windows == 'true') &&
      always() &&
      (needs.build-rolldown-windows.result == 'success' || needs.build-rolldown-windows.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 12GB
          drive-format: ReFS
          env-mapping: |
            PNPM_HOME,{{ DEV_DRIVE }}/.pnpm

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          version: '0.2.1'
          cache: true

      - name: Download Native Rolldown Build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rolldown-native-windows-latest
          path: packages/rolldown/dist

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      # `just setup-vite` is the only entry point that touches `vite/`;
      # run.ts only clones the prepared checkout.
      - name: Setup Vite checkout
        if: ${{ needs.changes.outputs.node-changes == 'true' }}
        run: vp run --filter '@rolldown-internal/scripts' setup-vite

      - name: Run Vite Tests
        if: ${{ needs.changes.outputs.node-changes == 'true' }}
        run: vp run --filter vite-tests test

  build-rolldown-windows:
    needs: changes
    if: github.ref_name == 'main' || needs.changes.outputs.run-windows == 'true'
    uses: ./.github/workflows/reusable-native-build.yml
    with:
      changed: ${{ needs.changes.outputs.node-changes == 'true' }}
      os: windows-latest

  build-rolldown-macos:
    needs: changes
    if: github.ref_name == 'main'
    uses: ./.github/workflows/reusable-native-build.yml
    with:
      changed: ${{ needs.changes.outputs.node-changes == 'true' }}
      os: macos-latest

  build-rolldown-ubuntu:
    needs: changes
    uses: ./.github/workflows/reusable-native-build.yml
    with:
      changed: ${{ needs.changes.outputs.node-changes == 'true' }}
      os: ubuntu-latest

  node-validation:
    name: Node Validation
    needs: [changes, build-rolldown-ubuntu]
    if: ${{ needs.changes.outputs.node-changes == 'true' }}
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Setup Rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          tools: just
          cache-key: native-build
          save-cache: false

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          version: '0.2.1'
          cache: true

      - name: Download Native Rolldown Build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rolldown-native-ubuntu-latest
          path: packages/rolldown/dist

      - name: Add WASI target
        run: rustup target add wasm32-wasip1-threads wasm32-wasip1

      - name: Build @rolldown/browser
        run: just build-browser

      - name: Assert browser CurrentThread timer registration
        run: node packages/browser-tests/runtime-contract.mjs packages/browser/dist

      - name: Test packed browser package in Wrangler and Miniflare
        run: node scripts/wasi/check-workerd-packed-consumer.mjs

      # Covers what `packages/workerd-tests/memory.mjs` cannot: the per-rebuild Wasm memory slope
      # WITH plugin hooks. Deliberately not copied into reusable-release-build.yml —
      # that lane builds a RELEASE wasm and these budgets were measured on the DEBUG one.
      - name: Test @rolldown/browser/workerd end-to-end in real workerd
        # --rounds=20 shrinks the slope quantum to ~0.0037 MiB/rebuild, giving the
        # moduleBoxDelta control (threshold 0.014) margin; the budget bands are round-invariant.
        run: node packages/workerd-tests/suite.mjs --rounds=20

      # `just build-browser` regenerates the wasip1 loaders byte-identically, so the only
      # expected drift is binding.d.cts (feature-gated doc comments). Restore it so the
      # `git diff --exit-code` below keeps guarding the @rolldown/debug generated code.
      - name: Assert browser-build drift allowlist and restore expected regen
        run: |
          set -euo pipefail
          changed=()
          while IFS= read -r file; do
            changed+=("$file")
          done < <(git diff --name-only -- packages/rolldown/src)
          unexpected=()
          for file in "${changed[@]}"; do
            case "$file" in
              packages/rolldown/src/binding.d.cts) ;;
              *) unexpected+=("$file") ;;
            esac
          done
          if (( ${#unexpected[@]} > 0 )); then
            echo "::error::Unexpected packages/rolldown/src drift from 'just build-browser' (not in the allowlist):" >&2
            printf ' - %s\n' "${unexpected[@]}" >&2
            git --no-pager diff -- "${unexpected[@]}"
            exit 1
          fi
          if (( ${#changed[@]} > 0 )); then
            echo "Restoring expected browser-build regeneration:"
            printf ' - %s\n' "${changed[@]}"
            git checkout -- "${changed[@]}"
          fi

      - name: Build @rolldown/debug
        run: just build-rolldown-debug

      - name: Build `@rolldown/test-dev-server`
        run: vp run --filter '@rolldown/test-dev-server' build

      - name: Make sure generated code of `@rolldown/debug` is up-to-date
        run: git diff --exit-code

      - name: Lint Code
        run: vp lint

      - name: Node Type Test
        run: vp run --filter rolldown-tests test:types

      - name: Lint publint
        run: vp run lint-publint

      - name: Lint exports & dependencies
        run: vp run lint-knip

      - name: Validate workspace package
        run: node scripts/misc/published-package-check.mjs

  repo-validation:
    name: Repo Validation
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Setup Rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          cache-key: repo-validation
          save-cache: ${{ github.ref_name == 'main' }}
          components: rustfmt

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          version: '0.2.1'
          cache: true

      - name: Lint Filename
        run: cargo ls-lint

      - name: update generated code
        run: |
          cargo run --bin generator
          git diff --exit-code

  typos:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: crate-ci/typos@4d9c206a77c041268485162b8e2579ad7a5cb9a3 # v1.50.0
        with:
          files: .
