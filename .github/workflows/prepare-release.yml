name: Prepare Release

permissions: {}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g. 1.0.1). A version lower than npm latest is prepared on its vX.Y branch.'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Release
    if: github.repository == 'rolldown/rolldown'
    runs-on: ubuntu-latest
    permissions:
      contents: write # for create-pull-request
      pull-requests: write # for create-pull-request
    env:
      # No step needs a browser, and Playwright on v1.0 cannot install one on Ubuntu 26.04.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for changelog and the target branch
          persist-credentials: true # for create-pull-request

      - name: Set version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"

      # Before the toolchain setup, so it uses the target branch's toolchain and lockfile.
      - name: Switch to target branch
        id: target
        run: |
          branch="$(node scripts/misc/release-line.mjs target --version "$VERSION")"
          if ! git rev-parse --verify --quiet "refs/remotes/origin/${branch}" > /dev/null; then
            echo "::error::v${VERSION} is released from ${branch}, which does not exist yet. See MAINTENANCE.md."
            exit 1
          fi
          git switch "$branch"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: '1.7.0'
          cache: true

      - uses: oxc-project/setup-rust@12a52e3caf7bac9d8b9ca550a82c425ed6343aee # v1.0.18
        with:
          cache-key: warm
          tools: cargo-release-oxc

      - name: Check version
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          node scripts/misc/release-line.mjs prepare --branch "$TARGET_BRANCH" --version "$VERSION"
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v${VERSION}" > /dev/null; then
            echo "::error::Tag v${VERSION} already exists"
            exit 1
          fi

      - name: Bump crate versions
        run: |
          mkdir -p target
          cargo release-oxc update --release crates --version ${VERSION}

      # `cargo release-oxc update` writes `version = "X"`, which Cargo reads as `^X`. The
      # rolldown crates do not follow semver, so a crate published from a vX.Y branch would
      # build against a newer minor of its siblings. Pin them to each other with `=X`.
      - name: Pin crate versions to each other
        run: |
          perl -pi -e 's/^([a-z_]+ = \{ version = ")\Q$ENV{VERSION}\E(", path = "crates\/)/$1=$ENV{VERSION}$2/' Cargo.toml
          unpinned=$(grep -F 'path = ' Cargo.toml | grep -cF "version = \"${VERSION}\"" || true)
          if [ "$unpinned" -ne 0 ]; then
            echo "::error::${unpinned} crate(s) in Cargo.toml still use ^${VERSION}"
            exit 1
          fi
          echo "Pinned $(grep -cF "version = \"=${VERSION}\"" Cargo.toml) crates to =${VERSION}"

      - name: Update Cargo.lock after crate bump
        run: cargo check

      - run: just bump-packages ${VERSION}

      - name: Regenerate binding.js after version bump
        run: vp run --filter rolldown build-binding

      - name: Generate changelog via git cliff
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        env:
          # Used to make request to GitHub without ratelimits.
          # `secrets.GIT_CLIFF_TOKEN` only has read permission.
          GITHUB_TOKEN: ${{ secrets.GIT_CLIFF_TOKEN }}
        with:
          version: v2.9.1 # git cliff version
          config: cliff.toml
          # perf-kit has its own changelog.
          # Only count tags reachable from the target branch, so a maintenance
          # release does not end the range of the next release on main.
          args: --unreleased --use-branch-tags --exclude-path "packages/perf-kit/**" --prepend CHANGELOG.md --tag ${{ env.VERSION }}

      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        if: ${{ steps.changelog.outputs.content }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: |
            CHANGELOG.md
            packages/**/package.json
            packages/rolldown/src/binding.cjs
            Cargo.toml
            Cargo.lock
            crates/**/Cargo.toml
          commit-message: 'release: v${{ env.VERSION }}'
          body: ${{ steps.changelog.outputs.content }}
          branch: release-v${{ env.VERSION }}
          branch-suffix: timestamp
          base: ${{ steps.target.outputs.branch }}
          title: 'release: v${{ env.VERSION }}'
          assignees: Boshen, shulaoda
