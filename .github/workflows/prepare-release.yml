name: Prepare Release

permissions: {}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g. 1.0.1)'
        required: true
        type: string
      target_branch:
        description: 'Release line: main, or a vX.Y maintenance branch (e.g. v1.1)'
        required: true
        default: main
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.target_branch }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Release
    if: github.repository == 'rolldown/rolldown'
    runs-on: ubuntu-latest
    permissions:
      contents: write # for create-pull-request
      pull-requests: write # for create-pull-request
    steps:
      - name: Check target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          if [[ ! "$TARGET_BRANCH" =~ ^(main|v[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::target_branch must be main or a vX.Y maintenance branch, received ${TARGET_BRANCH}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0 # for changelog
          persist-credentials: true # for create-pull-request

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: '1.0.0'
          cache: true

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          cache-key: warm
          tools: cargo-release-oxc

      - name: Set version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"

      - name: Check version
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: node scripts/misc/release-line.mjs prepare --branch "$TARGET_BRANCH" --version "$VERSION"

      - name: Bump crate versions
        run: |
          mkdir -p target
          cargo release-oxc update --release crates --version ${VERSION}

      - name: Update Cargo.lock after crate bump
        run: cargo check

      - run: just bump-packages ${VERSION}

      - name: Regenerate binding.js after version bump
        run: vp run --filter rolldown build-binding

      - name: Generate changelog via git cliff
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        env:
          # Used to make request to GitHub without ratelimits.
          # `secrets.GIT_CLIFF_TOKEN` only has read permission.
          GITHUB_TOKEN: ${{ secrets.GIT_CLIFF_TOKEN }}
        with:
          version: v2.9.1 # git cliff version
          config: cliff.toml
          # perf-kit has its own changelog.
          # Only count tags reachable from the target branch, so a maintenance
          # release does not end the range of the next release on main.
          args: --unreleased --use-branch-tags --exclude-path "packages/perf-kit/**" --prepend CHANGELOG.md --tag ${{ env.VERSION }}

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: ${{ steps.changelog.outputs.content }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: |
            CHANGELOG.md
            packages/**/package.json
            packages/rolldown/src/binding.cjs
            Cargo.toml
            Cargo.lock
            crates/**/Cargo.toml
          commit-message: 'release: v${{ env.VERSION }}'
          body: ${{ steps.changelog.outputs.content }}
          branch: release-v${{ env.VERSION }}
          branch-suffix: timestamp
          base: ${{ inputs.target_branch }}
          title: 'release: v${{ env.VERSION }}'
          assignees: Boshen, shulaoda
