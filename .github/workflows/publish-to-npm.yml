name: Publish to NPM

permissions: {}

on:
  push:
    branches:
      - main
      - 'v[0-9]*'
    paths:
      - packages/rolldown/package.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release waiting for approval must not be cancelled by a later push.
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      make_latest: ${{ steps.version.outputs.make_latest }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      # Publishes only for a merged `release: vX.Y.Z` commit, and picks the npm
      # dist-tag from the branch: `latest` on main, `previous` on vX.Y.
      - name: Resolve release
        id: version
        run: |
          node scripts/misc/release-line.mjs publish \
            --branch "$GITHUB_REF_NAME" \
            --subject "$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Check tag does not exist
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v${VERSION}" > /dev/null; then
            echo "::error::Tag v${VERSION} already exists"
            exit 1
          fi
          echo "Releasing v${VERSION} under npm dist-tag ${DIST_TAG}"

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    name: Build bindings and node packages
    uses: ./.github/workflows/reusable-release-build.yml

  notify-before-publish:
    needs: [check, build]
    if: github.repository == 'rolldown/rolldown'
    name: Notify Before Publish
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_ROLLDOWN_CHANNEL }}
          embed-title: Rolldown Release
          embed-description: Requesting approval for Rolldown v${{ needs.check.outputs.version }} (npm dist-tag `${{ needs.check.outputs.dist_tag }}`).
          embed-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  publish:
    needs: [check, build, notify-before-publish]
    if: github.repository == 'rolldown/rolldown'
    name: Publish npm Packages
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 300
    permissions:
      id-token: write # for `npm publish --provenance`
    env:
      # npm publish-time scanning makes a successful upload temporarily
      # unavailable to installs. After each dependency tier becomes visible on
      # this runner's registry edge, allow time for other CDN edges to settle.
      # Native bindings can stay hidden for ~90 minutes (#10721).
      PUBLISH_PROPAGATION_MIN_SECONDS: '60'
      PUBLISH_PROPAGATION_TIMEOUT_SECONDS: '7200'
      DIST_TAG: ${{ needs.check.outputs.dist_tag }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: '1.0.0'
          cache: true

      - name: Git Reset Hard
        run: git reset --hard # fix pnpm install add new line for package.json

      - name: Download Binding Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/rolldown/artifacts
          pattern: bindings-*

      - name: Create rolldown/npm dirs
        run: vp exec --filter rolldown napi create-npm-dirs

      - name: Pin @napi-rs/wasm-runtime in the wasm32-wasi binding
        run: node scripts/misc/pin-wasi-binding-deps.mjs

      - name: Move Binding Artifacts
        run: vp run --filter rolldown artifacts

      - name: List Rolldown Bindings
        run: ls -R ./packages/rolldown/npm
        shell: bash

      - name: Check wasm32-wasi binding deps match @rolldown/browser
        run: node scripts/misc/check-wasi-binding-deps.mjs

      - name: Download Node Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/rolldown/dist
          name: node-artifact

      - name: Download `@rolldown/browser` Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/browser/dist
          name: browser-artifact

      - name: Download `@rolldown/debug` Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/debug/dist
          name: debug-artifact

      - name: Copy Licenses
        run: |
          find ./packages/ -type d -maxdepth 1 -exec cp LICENSE {} \;
          find ./packages/ -type d -maxdepth 1 -exec cp THIRD-PARTY-LICENSE {} \;

      - name: Install npm
        # Needed before any `npm publish` so OIDC provenance uses a current npm.
        run: npm install -g npm

      - name: Publish(Dry Run)
        # `NAPI_DRY_RUN` makes rolldown's `prepublishOnly` hook pass `--dry-run`
        # through to `napi pre-publish`. Without it, the hook publishes the
        # `@rolldown/binding-*` packages for real during this "dry run" step.
        env:
          NAPI_DRY_RUN: '1'
        run: |
          vp pm publish -r --filter rolldown --filter @rolldown/browser --filter @rolldown/debug --tag "$DIST_TAG" --dry-run --no-git-checks

      # `npm publish` can succeed before npm's malware scan makes the tarball
      # installable. Publish bindings first, wait until they resolve, then
      # publish packages that pin them in optionalDependencies (#10721, #10723).
      - name: Publish binding packages
        # `napi pre-publish` runs `npm publish` without `--tag`; npm reads the
        # tag from this instead. Only set here: at job level it would also
        # apply to `npm install -g npm` above.
        env:
          NPM_CONFIG_TAG: ${{ needs.check.outputs.dist_tag }}
        run: vp run --filter rolldown prepublishOnly

      - name: Wait for binding packages
        run: node scripts/misc/wait-for-npm-packages.mjs --from-binding-dirs packages/rolldown/npm

      - name: Publish npm packages
        # Bindings are already on npm. Skip napi's optional publish so this
        # step only uploads rolldown / @rolldown/browser / @rolldown/debug.
        env:
          NAPI_SKIP_OPTIONAL_PUBLISH: '1'
        run: vp pm publish -r --filter rolldown --filter @rolldown/browser --filter @rolldown/debug --tag "$DIST_TAG" --no-git-checks

      - name: Wait for published packages
        run: >-
          node scripts/misc/wait-for-npm-packages.mjs
          --from-package-json packages/rolldown/package.json
          --from-package-json packages/browser/package.json
          --from-package-json packages/debug/package.json

  release:
    needs: [check, publish]
    if: github.repository == 'rolldown/rolldown'
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # for softprops/action-gh-release@v1
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Get changelog from commit body
        id: changelog
        run: |
          {
            echo 'CHANGELOG<<EOF'
            git show -s --format=%b
            echo EOF
          } >> $GITHUB_OUTPUT

      # Debug info split out of the release bindings; see internal-docs/panic-symbolication/implementation.md
      - name: Download Debug Info Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: debuginfo
          pattern: debuginfo-*
          merge-multiple: true

      - name: Create GitHub Release
        id: github_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: v${{ needs.check.outputs.version }} # tags the current commit
          TARGET: ${{ github.sha }}
          NOTES: ${{ steps.changelog.outputs.CHANGELOG }}
          # Only releases from main become GitHub's "Latest" release.
          MAKE_LATEST: ${{ needs.check.outputs.make_latest }}
        run: |
          url=$(gh release create "$TAG_NAME" \
            --target "$TARGET" \
            --title "$TAG_NAME" \
            --notes "$NOTES" \
            --latest="$MAKE_LATEST" \
            debuginfo/*.debuginfo.tar.zst)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_ROLLDOWN_CHANNEL }}
          embed-title: Rolldown Release
          embed-description: Released v${{ needs.check.outputs.version }}.
          embed-url: ${{ steps.github_release.outputs.url }}
