name: Release Crates

permissions: {}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'v[0-9]*'
    paths:
      - crates/rolldown/Cargo.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      # Same check as publish-to-npm.yml, so crates are never published for a
      # release that npm rejects.
      - name: Resolve release
        id: version
        run: |
          node scripts/misc/release-line.mjs publish \
            --branch "$GITHUB_REF_NAME" \
            --subject "$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    # `!cancelled()` keeps this job when `check` is skipped on workflow_dispatch.
    if: >-
      !cancelled() &&
      github.repository == 'rolldown/rolldown' &&
      (github.event_name == 'workflow_dispatch' || needs.check.outputs.release == 'true')
    name: Release crates
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      id-token: write # Required for OIDC token exchange (trusted publishing)
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          cache-key: warm
          tools: cargo-release-oxc

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo release-oxc publish --release crates
