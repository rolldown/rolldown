name: Rust Test

permissions: {}

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      changed:
        required: true
        type: boolean

jobs:
  run:
    if: ${{ inputs.changed }}
    name: Cargo Test
    runs-on: ${{ inputs.os == 'ubuntu-latest' && 'namespace-profile-linux-x64-default' || inputs.os == 'macos-latest' && 'namespace-profile-mac-default' || inputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # Pull submodules for additional files
          persist-credentials: false

      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        if: runner.os == 'Windows'
        with:
          drive-size: 20GB
          drive-format: ReFS
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup
            PNPM_HOME,{{ DEV_DRIVE }}/.pnpm

      # On Windows, steps that start at the same time can fail with "event.json
      # is being used by another process". So Windows runs them one by one.
      - parallel:
          - name: Setup Rust
            uses: oxc-project/setup-rust@12a52e3caf7bac9d8b9ca550a82c425ed6343aee # v1.0.18
            with:
              tools: just
              cache-key: cargo-test
              save-cache: ${{ github.ref_name == 'main' }}
              target-dir: ${{ runner.os == 'Windows' && format('{0}/target', env.DEV_DRIVE) || '' }}

          - if: runner.os != 'Windows'
            uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
            with:
              version: '1.7.0'
              cache: true

          - name: Cache esbuild snapshots
            if: runner.os != 'Windows'
            uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
            with:
              path: scripts/tmp/esbuild-tests/snapshots
              key: esbuild-snapshots-${{ hashFiles('scripts/src/esbuild-tests/urls.ts') }}

      - if: runner.os == 'Windows'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: '1.7.0'
          cache: true

      - name: Cache esbuild snapshots
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/tmp/esbuild-tests/snapshots
          key: esbuild-snapshots-${{ hashFiles('scripts/src/esbuild-tests/urls.ts') }}

      - name: Run Test
        run: just test-rust
        env:
          # Reject updated snapshots https://insta.rs/docs/advanced/#controlling-snapshot-updating
          INSTA_UPDATE: no

      - name: Check if esbuild tests diff has changed
        run: |
          just ued
          git diff --exit-code
