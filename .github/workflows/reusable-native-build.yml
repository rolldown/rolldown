name: Reusable Rolldown Native Build

permissions: {}

on:
  workflow_call:
    inputs:
      changed:
        required: true
        type: boolean
      os:
        required: true
        type: string

jobs:
  run:
    name: Build Rolldown Native
    if: ${{ inputs.changed }}
    runs-on: ${{ inputs.os == 'ubuntu-latest' && 'namespace-profile-linux-x64-default' || inputs.os == 'macos-latest' && 'namespace-profile-mac-default' || inputs.os }}
    timeout-minutes: 15
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        if: runner.os == 'Windows'
        with:
          drive-size: 12GB
          drive-format: ReFS
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup
            PNPM_HOME,{{ DEV_DRIVE }}/.pnpm

      # On Windows, steps that start at the same time can fail with "event.json
      # is being used by another process". So Windows runs them one by one.
      - parallel:
          - name: Setup Rust
            uses: oxc-project/setup-rust@12a52e3caf7bac9d8b9ca550a82c425ed6343aee # v1.0.18
            with:
              tools: just
              cache-key: native-build
              save-cache: ${{ github.ref_name == 'main' }}
              target-dir: ${{ runner.os == 'Windows' && format('{0}/target', env.DEV_DRIVE) || '' }}

          - if: runner.os != 'Windows'
            uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
            with:
              version: '1.7.0'
              cache: true

      - if: runner.os == 'Windows'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: '1.7.0'
          cache: true

      - name: Build Native Rolldown
        run: just build-rolldown

      - name: Check no diff
        run: git diff --exit-code

      - name: Upload Rolldown Native
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rolldown-native-${{ inputs.os }}
          path: packages/rolldown/dist
          if-no-files-found: error
