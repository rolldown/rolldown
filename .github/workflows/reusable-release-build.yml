name: Release Build

permissions: {}

on:
  workflow_call:
    inputs:
      version: # Should be valid semver or 'patch', 'minor', 'major', 'commit'. See scripts/misc/bump-version.js for details.
        type: string
        default: 'noop'

jobs:
  build-binding:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            build: vp run ci:build-release-binding --target x86_64-apple-darwin

          - os: macos-latest
            target: aarch64-apple-darwin
            build: vp run ci:build-release-binding --target aarch64-apple-darwin
            debuginfo: true

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: vp run ci:build-release-binding --target x86_64-pc-windows-msvc
            debuginfo: true

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            build: vp run ci:build-release-binding --target aarch64-pc-windows-msvc

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: vp run ci:build-release-binding --target x86_64-unknown-linux-gnu --use-napi-cross
            debuginfo: true

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: vp run ci:build-release-binding --target x86_64-unknown-linux-musl -x

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: vp run ci:build-release-binding --use-napi-cross --target aarch64-unknown-linux-gnu

          - os: ubuntu-latest
            target: aarch64-unknown-linux-ohos
            build: vp run ci:build-release-binding --target aarch64-unknown-linux-ohos

          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            build: vp run ci:build-release-binding --target armv7-unknown-linux-gnueabihf --use-napi-cross

          - os: ubuntu-latest
            target: aarch64-linux-android
            build: vp run ci:build-release-binding --target aarch64-linux-android

          - os: ubuntu-latest
            target: armv7-linux-androideabi
            build: vp run ci:build-release-binding --target armv7-linux-androideabi

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: vp run ci:build-release-binding -x --target aarch64-unknown-linux-musl

          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
            build: |
              export CFLAGS="-fuse-ld=lld"
              vp run ci:build-release-binding --target s390x-unknown-linux-gnu --use-napi-cross

          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
            build: vp run ci:build-release-binding --target powerpc64le-unknown-linux-gnu --use-napi-cross

          - os: ubuntu-latest
            target: wasm32-wasip1-threads
            build: |
              vp run --filter rolldown build-binding:wasi:release

    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Setup Rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          # No caching to avoid cache poisoning in release artifacts
          restore-cache: false
          save-cache: false

      - name: Rustup Adds Target
        run: rustup target add ${{ matrix.target }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: ${{ contains(matrix.target, 'musl') }}
        with:
          version: 0.15.2

      - name: Setup OpenHarmony SDK
        if: ${{ contains(matrix.target, 'ohos') }}
        uses: Boshen/setup-ohos-sdk@edb865a89a712f1f15dbad932dfa9cfce849d95c # v1.0.0

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        if: ${{ contains(matrix.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: '1.0.0'
          cache: true

      # Targets with `debuginfo: true` build with debug info, which the next
      # steps split out and publish. The env overrides keep `[profile.release]`
      # itself unchanged. See internal-docs/panic-symbolication/implementation.md
      - name: Enable Debug Info
        if: ${{ matrix.debuginfo }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          echo 'CARGO_PROFILE_RELEASE_DEBUG=line-tables-only' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_RELEASE_STRIP=none' >> "$GITHUB_ENV"
          if [[ "$TARGET" == *-apple-darwin ]]; then
            echo 'CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=packed' >> "$GITHUB_ENV"
          fi

      - name: Build Binding
        run: ${{ matrix.build }}
        shell: bash
        env:
          TARGET_CC: clang # for mimalloc

      - name: Split Debug Info
        if: ${{ matrix.debuginfo }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/misc/split-debuginfo.mjs --target "$TARGET"

      - name: Upload Binding Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: bindings-${{ matrix.target }}
          path: |
            packages/rolldown/src/rolldown-binding.*.node
            packages/rolldown/src/rolldown-binding.*.wasm

      - name: Upload Debug Info Artifact
        if: ${{ matrix.debuginfo }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: debuginfo-${{ matrix.target }}
          path: target/debuginfo/*.debuginfo.tar.zst

  # Keep this list in sync with the `debuginfo: true` entries above.
  # The check only reads the files, so every target runs on Linux.
  verify-debuginfo:
    needs: build-binding
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
    name: Verify Debug Info ${{ matrix.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Download Binding Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: packages/rolldown/src

      - name: Download Debug Info Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debuginfo-${{ matrix.target }}
          path: target/debuginfo

      - name: Verify Debug Info Matches Binding
        run: node scripts/misc/verify-debuginfo.mjs

  build-freebsd:
    name: Build FreeBSD
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - name: Build
        id: build
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        env:
          DEBUG: napi:*
          RUSTUP_IO_THREADS: 1
        with:
          operating_system: freebsd
          version: '15.1'
          memory: 8G
          cpu_count: 3
          environment_variables: 'DEBUG RUSTUP_IO_THREADS'
          shell: bash
          run: |
            sudo pkg install -y -f curl node libnghttp2 npm cmake
            curl https://sh.rustup.rs -sSf --output rustup.sh
            sh rustup.sh -y --profile minimal --default-toolchain stable
            source "$HOME/.cargo/env"
            rustup toolchain install
            echo "~~~~ rustc --version ~~~~"
            rustc --version
            echo "~~~~ node -v ~~~~"
            node -v
            pwd
            ls -lah
            whoami
            env
            sudo corepack enable
            sudo npm i -g corepack@latest # use a newer corepack due to https://github.com/nodejs/corepack/issues/612
            pnpm install --ignore-scripts
            pnpm run ci:build-release-binding --target x86_64-unknown-freebsd
            rm -rf node_modules
            rm -rf target
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-x86_64-unknown-freebsd
          path: ./packages/rolldown/src/rolldown-binding.*.node
          if-no-files-found: error

  build-freebsd-arm64:
    name: Build FreeBSD arm64
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - name: Build
        id: build
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        env:
          DEBUG: napi:*
          RUSTUP_IO_THREADS: 1
        with:
          operating_system: freebsd
          # Cross-compile from the native x86_64 guest. There is no aarch64
          # FreeBSD runner with KVM, and rustup / @oxc-node/core ship no
          # aarch64-freebsd builds, so building inside an emulated arm64 VM is
          # both slow and blocked. Run the tooling natively on x86_64 and
          # cross-link with the base clang against an arm64 sysroot instead.
          architecture: x86-64
          version: '15.1'
          memory: 8G
          cpu_count: 3
          environment_variables: 'DEBUG RUSTUP_IO_THREADS'
          shell: bash
          run: |
            sudo pkg install -y -f curl node libnghttp2 npm cmake
            curl https://sh.rustup.rs -sSf --output rustup.sh
            sh rustup.sh -y --profile minimal --default-toolchain stable
            source "$HOME/.cargo/env"
            rustup toolchain install
            rustup target add aarch64-unknown-freebsd
            # aarch64 sysroot (headers, libc, crt) for the cross link
            SYSROOT=/tmp/sysroot
            sudo mkdir -p "$SYSROOT"
            fetch -q -o /tmp/base.txz "https://download.freebsd.org/releases/arm64/aarch64/15.1-RELEASE/base.txz"
            sudo tar -xJf /tmp/base.txz -C "$SYSROOT"
            printf '#!/bin/sh\nexec clang --target=aarch64-unknown-freebsd --sysroot=%s "$@"\n' "$SYSROOT" > /tmp/aarch64-cc
            chmod +x /tmp/aarch64-cc
            export CARGO_TARGET_AARCH64_UNKNOWN_FREEBSD_LINKER=/tmp/aarch64-cc
            export CC_aarch64_unknown_freebsd=/tmp/aarch64-cc
            export CXX_aarch64_unknown_freebsd=/tmp/aarch64-cc
            export CFLAGS_aarch64_unknown_freebsd="--target=aarch64-unknown-freebsd --sysroot=$SYSROOT"
            export CXXFLAGS_aarch64_unknown_freebsd="--target=aarch64-unknown-freebsd --sysroot=$SYSROOT"
            echo "~~~~ rustc --version ~~~~"
            rustc --version
            echo "~~~~ node -v ~~~~"
            node -v
            sudo corepack enable
            sudo npm i -g corepack@latest # use a newer corepack due to https://github.com/nodejs/corepack/issues/612
            pnpm install --ignore-scripts
            pnpm run ci:build-release-binding --target aarch64-unknown-freebsd
            rm -rf node_modules
            rm -rf target
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-aarch64-unknown-freebsd
          path: ./packages/rolldown/src/rolldown-binding.*.node
          if-no-files-found: error

  build-node-packages:
    strategy:
      fail-fast: false
    name: Build Node Package
    runs-on: namespace-profile-linux-x64-default
    env:
      RELEASING: 'true'
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: '1.0.0'
          cache: true

      - name: Build Node binding
        # This binary is only used to build the node package itself. It's won't be published.
        run: vp run --filter rolldown build-binding

      - name: Determine Version
        if: ${{ inputs.version != 'noop' }}
        run: node --import @oxc-node/core/register ./scripts/misc/bump-version.js ${ROLLDOWN_VERSION}
        env:
          ROLLDOWN_VERSION: ${{ inputs.version }}

      - name: Build Node Packages
        # Binaries are built in the previous steps. Unlike in local development, we only need to build the node package itself.
        run: vp run --filter rolldown build-node

      - name: Upload Node Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: node-artifact
          path: |
            packages/rolldown/dist/**

      - name: Upload `rolldown-version.txt`
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: rolldown-version
          path: |
            rolldown-version.txt

  build-rolldown-browser:
    strategy:
      fail-fast: false
    name: Build `@rolldown/browser` Package
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Setup Rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          # No caching to avoid cache poisoning in release artifacts
          restore-cache: false
          save-cache: false

      - name: Add WASI target
        run: rustup target add wasm32-wasip1-threads

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: '1.0.0'
          cache: true

      - name: Build Node binding
        # This binary is only used to build the node package itself. It's won't be published.
        run: vp run --filter rolldown build-binding

      - name: Determine Version
        if: ${{ inputs.version != 'noop' }}
        run: node --import @oxc-node/core/register ./scripts/misc/bump-version.js ${ROLLDOWN_VERSION}
        env:
          ROLLDOWN_VERSION: ${{ inputs.version }}

      - name: Build `@rolldown/browser`
        # Binaries are built in the previous steps. Unlike in local development, we only need to build the node package itself.
        run: vp run --filter "@rolldown/browser" build:release

      - name: Upload `@rolldown/browser` Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: browser-artifact
          path: |
            packages/browser/dist/**

  build-rolldown-debug:
    strategy:
      fail-fast: false
    name: Build `@rolldown/debug` Package
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Setup Rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          # No caching to avoid cache poisoning in release artifacts
          restore-cache: false
          save-cache: false

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: '1.0.0'
          cache: true

      - name: Build `@rolldown/debug`
        # This binary is only used to build the node package itself. It's won't be published.
        run: vp run --filter "@rolldown/debug" build

      - name: Upload `@rolldown/debug` Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: debug-artifact
          path: |
            packages/debug/dist/**
