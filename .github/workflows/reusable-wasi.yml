name: WASI

permissions: {}

on:
  workflow_call:
    inputs:
      changed:
        required: true
        type: boolean

jobs:
  run:
    name: WASI
    if: ${{ inputs.changed }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          tools: just
          cache-key: debug-build-wasi
          save-cache: ${{ github.ref_name == 'main' }}

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          version: '0.2.1'
          cache: true

      - name: Add WASI target
        run: rustup target add wasm32-wasip1-threads

      - name: Build Rolldown with WASI Binding
        run: just build-rolldown-wasi

      - name: Build `@rolldown/test-dev-server`
        run: vp run --filter '@rolldown/test-dev-server' build

      # `test:wasi` is `test:main` with `ROLLDOWN_WASI_TEST=1`, which skips the tests that the wasm binding cannot pass; every skip states its own reason.
      #
      # The suite is flaky under the wasm binding (~1/3 of runs) because multiple
      # wasm instances share one dlmalloc heap and corrupt it under concurrent
      # allocation while the memory grows — a "memory access out of bounds" trap
      # that has nothing to do with the code under test. See #10697. Retry the
      # whole step (the crash takes down the wasm process, so a per-test retry
      # cannot help); a real failure still fails all attempts and reds the job.
      # The crash also shows up as a hung suite: a dead worker is dropped
      # silently, so in-flight builds wait forever and the plain retry loop
      # stalls on the first attempt without ever retrying, eating the whole
      # 45-minute job budget. `timeout` caps each attempt so a hang becomes a
      # failed attempt (exit 124) and retries; the suite finishes in 1-2 min.
      - name: Node Test
        run: |
          for attempt in 1 2 3; do
            if timeout 300 vp run --filter rolldown-tests test:wasi; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "::warning::wasi Node Test attempt ${attempt} failed or hung; retrying (known flake, see #10697)"
            else
              echo "::warning::wasi Node Test attempt ${attempt} failed or hung; no more retries (known flake, see #10697)"
            fi
          done
          exit 1

      - name: Stability Test
        run: vp run --filter rolldown-tests test:stability

      # Runs against the WASI binding itself (NAPI_RS_FORCE_WASI), which no
      # other CI test does. Regression coverage for #8411 and #8747.
      - name: Tokio Runtime Lifecycle Test
        run: vp run --filter rolldown-tests test:wasi-runtime

      # `@example/native-magic-string` is excluded because it depends on a native-only addon.
      - name: Build Examples
        run: vp run --filter '@example/*' --filter '!@example/native-magic-string' build
