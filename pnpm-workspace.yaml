packages:
  - packages/*
  - packages/rolldown/tests
  - packages/test-dev-server/tests
  - packages/test-dev-server/tests/playground/*
  - packages/test-dev-server/tests/fixtures/*
  - packages/rolldown/tests/fixtures/resolve/issue-5846
  - packages/rolldown/tests/fixtures/resolve/issue-5846-2
  - packages/rolldown/tests/fixtures/tree-shake/module-side-effects-precedence/hook-side-effects-overrides-package-json
  - packages/rolldown/tests/fixtures/tree-shake/module-side-effects-precedence/option-over-package-json
  - docs
  - examples/*
  - scripts
  - crates/rolldown/tests/rolldown/topics/npm_packages
  - crates/rolldown/tests/rolldown/warnings/eval2
  - '!examples/yarn-pnp'

allowBuilds:
  better-sqlite3: true
  esbuild: true
  playwright-chromium: true
  sharp: true
  vue-demi: true
  workerd: true

# Kept for pnpm 10 (used on Node 20 in CI). pnpm 11 reads `allowBuilds` instead.
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - oxc-resolver
  - sharp
  - tree-sitter

overrides:
  # emnapi v2 line: napi-build at ad23bdeb unconditionally exports the emnapi v2
  # env-management symbols (emnapi_create_env/emnapi_delete_env) on WASI, which
  # only the 2.0.0-alpha C archives define. The released 2.0.0-alpha.3 ships the
  # per-flavor napi-rs archives the pin links (non-threads
  # `libemnapi-basic-napi-rs.a`, threads `libemnapi-napi-rs-mt.a`).
  emnapi: 2.0.0-alpha.3
  vitepress>vite: npm:rolldown-vite@latest

catalog:
  '@babel/core': ^7.29.7
  '@babel/preset-env': ^7.29.7
  '@babel/preset-typescript': ^7.29.7
  # emnapi v2 line (see the `emnapi` override above): the .wasm links the
  # 2.0.0-alpha C archives, so a v1 JS runtime is an ABI mismatch. Both
  # `packages/browser` and `packages/rolldown` resolve these through the catalog
  # so the ABI pin lives in exactly one place.
  '@emnapi/core': 2.0.0-alpha.3
  '@emnapi/runtime': 2.0.0-alpha.3
  '@jridgewell/trace-mapping': ^0.3.31
  '@napi-rs/cli': 3.7.2
  '@napi-rs/wasm-runtime': ~1.2.2
  '@oxc-node/cli': ^0.1.0
  '@oxc-node/core': ^0.1.0
  '@oxc-project/runtime': '=0.143.0'
  '@oxc-project/types': '=0.143.0'
  '@pnpm/find-workspace-packages': ^6.0.9
  '@rolldown/pluginutils': ^1.0.0
  '@rollup/plugin-commonjs': ^29.0.0
  '@rollup/plugin-node-resolve': ^16.0.0
  '@types/babel__core': 7.20.5
  '@types/connect': ^3.4.38
  '@types/fs-extra': ^11.0.4
  '@types/lodash-es': ^4.17.12
  '@types/node': 24.10.3
  '@types/semver': ^7.5.8
  '@types/serve-static': ^2.0.0
  buffer: ^6.0.3
  '@types/ws': ^8.18.0
  acorn: ^8.17.0
  astring: ^1.9.0
  cac: ^7.0.0
  chalk: ^5.3.0
  change-case: ^5.4.4
  connect: ^3.7.0
  consola: ^3.4.2
  dedent: ^1.5.3
  diff: ^9.0.0
  esbuild: ^0.28.0
  estree-toolkit: ^1.7.8
  execa: ^9.2.0
  fast-glob: ^3.3.3
  follow-redirects: ^1.15.6
  fresh-import: ^0.2.1
  fs-extra: ^11.4.0
  glob: ^13.0.0
  lodash-es: ^4.17.21
  micromatch: ^4.0.8
  miniflare: ^4.20260611.0
  oxc-parser: '=0.143.0'
  oxc-transform: '=0.143.0'
  pathe: ^2.0.3
  react: ^19.0.0
  react-dom: ^19.0.0
  remark-parse: ^11.0.0
  remeda: ^2.34.1
  rolldown-plugin-dts: ^0.28.0
  rollup: ^4.60.4
  semver: ^7.8.0
  serve-static: ^2.0.0
  signal-exit: 4.1.0
  source-map: 0.8.0
  tinybench: ^6.0.0
  tinyexec: ^1.0.1
  tsx: ^4.22.0
  typescript: ^6.0.0
  unified: ^11.0.5
  valibot: 1.4.2
  vite: ^8.0.0
  vitest: ^4.1.6
  vue: ^3.5.35
  web-tree-sitter: ^0.26.0
  ws: ^8.20.1
  wrangler: ^4.100.0
  zx: ^8.1.2

catalogs:
  # deps used by `rollup-tests` package. these should be synced with `rollup`
  rollup-tests:
    '@jridgewell/sourcemap-codec': ^1.5.5
    '@rollup/plugin-commonjs': ^29.0.0
    '@rollup/plugin-json': ^6.1.0
    '@rollup/plugin-node-resolve': ^16.0.0
    '@types/mocha': 10.0.10
    '@types/strip-comments': ^2.0.4
    acorn-import-assertions: ^1.9.0
    acorn-import-phases: ^1.0.4
    acorn-jsx: ^5.3.2
    buble: ^0.20.0
    fixturify: ^3.0.0
    magic-string: ^1.1.0
    mocha: ^11.7.5
    strip-comments: ^2.0.1
    source-map-support: ^0.5.21
    terser: ^5.49.0

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
  - rxjs@7.8.2

verifyDepsBeforeRun: install

minimumReleaseAgeExclude:
  - '@napi-rs/cli@3.7.2'
  - '@emnapi/core@1.11.2 || 2.0.0-alpha.3'
  - '@emnapi/runtime@1.11.2 || 2.0.0-alpha.3'
  - emnapi@1.11.2 || 2.0.0-alpha.3
  - '@emnapi/wasi-threads@2.0.1'
  - '@oxc-minify/*'
  - '@oxc-parser/*'
  - '@oxc-transform/*'
  - '@oxc-project/*'
  - oxc-minify
  - oxc-parser
  - oxc-transform
  - '@voidzero-dev/*'
  - vite-plus
  - vitepress-plugin-feedback-tracker@0.2.0-alpha.1
  - void
  - '@napi-rs/wasm-runtime'

# avoid accidentally relying on `NODE_PATH` env var
extendNodePath: false

# The catalog resolves @napi-rs/wasm-runtime to the 1.2.x line (~1.2.2), which
# declares @emnapi/core / @emnapi/runtime `^1.7.1 || ^2.0.0-alpha.3` peers and
# needs no rule. But the oxc packages (oxc-parser / oxc-transform / oxc-minify)
# still pull transitive 1.1.6 copies, which declare ^1.7.1 peers, and the
# `emnapi` override above forces those onto the v2 line. Keep allowing that
# resolution.
# @napi-rs/cli@3.7.2 declares an @emnapi/runtime ^1.7.1 peer for the same reason.
peerDependencyRules:
  allowedVersions:
    '@napi-rs/wasm-runtime>@emnapi/core': 2.0.0-alpha.3
    '@napi-rs/wasm-runtime>@emnapi/runtime': 2.0.0-alpha.3
    '@napi-rs/cli>@emnapi/core': 2.0.0-alpha.3
    '@napi-rs/cli>@emnapi/runtime': 2.0.0-alpha.3

patchedDependencies:
  '@napi-rs/cli@3.7.2': patches/@napi-rs__cli@3.7.2.patch
  # TEMP: vendors napi-rs#3353 (wasm32-wasip1 single-thread support incl. the
  # deferred workerd-safe loader) with per-flavor WASI artifact naming plus the
  # emnapi v2 loader migration (EMNAPI_LINK_DIR per flavor, TSFN/async-work JS
  # plugins) — see internal-docs/async-runtime/implementation.md. Regenerated
  # from the napi pin lineage (now `ad23bdeb`, whose only cli delta over
  # `a9c93cd5` — the Plan-A non-threads preflight archive rename to
  # `libemnapi-basic-napi-rs.a` plus emnapi 2.0.0-alpha.3 dep bumps — is folded
  # in) with a9c93cd5's botched cli/ merge resolved to the 56e32d5c (v3.10.5
  # line) side for build.ts/misc.ts/metadata.ts/version.ts/
  # load-wasi-template.ts (a9c93cd5 concatenated both parents' conflict hunks
  # and does not compile; the 56e32d5c side carries the emnapi-v2 loader
  # migration). dist rebuild of dist/index.cjs + dist/index.js + dist/cli.js —
  # cli.js is the standalone bundle behind the `napi` bin used by the publish
  # workflows. Remove once @napi-rs/cli ships it upstream.
