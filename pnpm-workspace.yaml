shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
  - rxjs@7.8.2

verifyDepsBeforeRun: install

minimumReleaseAgeExclude:
  - '@napi-rs/async-runtime'
  - '@napi-rs/cli'
  - '@oxc-minify/*'
  - '@oxc-parser/*'
  - '@oxc-transform/*'
  - '@oxc-project/*'
  - oxc-minify
  - oxc-parser
  - oxc-transform
  - '@voidzero-dev/*'
  - vite-plus
  - vitepress-plugin-feedback-tracker@0.2.0-alpha.1
  - void
  - '@napi-rs/wasm-runtime'
  - '@emnapi/*'
  - emnapi

# avoid accidentally relying on `NODE_PATH` env var
extendNodePath: false
